<!DOCTYPE html>
<html lang="ru">

        </div>
    </div>
    <div class="nav-hotel">

            <button class="book-btn">ВЫБРАТЬ</button>
        </div>

        <div class="room-card">
            <img src="images/room3.webp" alt="Комната 3" class="room-img">
