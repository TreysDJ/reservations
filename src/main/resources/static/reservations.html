<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Baltika Hotel»</title>
    <link rel="stylesheet" href="css/reservationsStyle.css">
    <script src="js/reservations.js" defer></script>
</head>
<body>
<div class="top-bar">
    <a class="address"
       href="https://www.google.com/maps/place/%D0%A1%D0%B5%D0%BD%D1%82-%D0%9F%D0%B8%D1%82%D0%B5%D1%80%D1%81%D0%B1%D0%B5%D1%80%D0%B3,+%D0%A4%D0%BB%D0%BE%D1%80%D0%B8%D0%B4%D0%B0,+%D0%A1%D0%A8%D0%90/@27.7914895,-82.7464279,11.64z/data=!4m6!3m5!1s0x88c2e663693aaa41:0x4cc4003bcd48bff!8m2!3d27.7671271!4d-82.6384451!16zL20vMGxocWw?entry=ttu&g_ep=EgoyMDI2MTAyNy4wIKXMDSoASAFQAw%3D%3D"
       target="_blank" class="maps-link">
        St. Petersburg, Florida, USA, North America
    </a>
</div>

<div class="logo-container">
    <div class="logo-left">
        <img src="images/Baltika_logo_2024.svg.webp" class="logo-img" alt="Логотип">
        <div class="logo-text">
            <p class="logo-name">BALTIKA</p>
            <p class="logo-dsc">LUXURY HOTEL</p>
        </div>
    </div>
    <div class="nav-hotel">
        <a href="hotel.html" class="nav-main-btn">НА ГЛАВНУЮ</a>
        <a href="hotel.html" class="nav-rooms-btn">КОМНАТЫ</a>
    </div>

</div>

<main>
    <h1>МОИ РЕЗЕРВАЦИИ</h1>
    <p id="reservations-message" role="status">Загрузка...</p>
    <div class="reservations-container"></div>

    <!-- Заготовка карточки. JavaScript сможет копировать ее для каждого бронирования. -->
    <template id="reservation-template">
        <div class="reservation-card">
            <img src="images/room5.webp" alt="Номер отеля" class="res-img">

            <div class="res-details">
                <h2 class="res-title"></h2>
                <p class="res-dates"></p>
                <p class="res-status"></p>
            </div>

            <div class="res-actions">
                <button class="res-approve">ПОДТВЕРДИТЬ</button>
                <button class="res-cancel">ОТМЕНИТЬ</button>
            </div>
        </div>
    </template>
</main>
</body>
</html>
