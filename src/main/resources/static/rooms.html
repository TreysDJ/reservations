<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Baltika rooms</title>
    <link rel="stylesheet" href="css/roomsStyle.css">
</head>

<body>
<div class="top-bar">
    <a class="address"
       href="https://www.google.com/maps/place/%D0%A1%D0%B5%D0%BD%D1%82-%D0%9F%D0%B8%D1%82%D0%B5%D1%80%D1%81%D0%B1%D0%B5%D1%80%D0%B3,+%D0%A4%D0%BB%D0%BE%D1%80%D0%B8%D0%B4%D0%B0,+%D0%A1%D0%A8%D0%90/@27.7914895,-82.7464279,11.64z/data=!4m6!3m5!1s0x88c2e663693aaa41:0x4cc4003bcd48bff!8m2!3d27.7671271!4d-82.6384451!16zL20vMGxocWw?entry=ttu&g_ep=EgoyMDI2MTAyNy4wIKXMDSoASAFQAw%3D%3D"
       target="_blank" class="maps-link">
        St. Petersburg, Florida, USA, North America
    </a>
</div>

<div class="logo-container">
    <div class="logo-left">
        <img src="images/Baltika_logo_2024.svg.webp" class="logo-img" alt="Логотип">
        <div class="logo-text">
            <p class="logo-name">BALTIKA</p>
            <p class="logo-dsc">LUXURY HOTEL</p>
        </div>
    </div>
    <div class="nav-hotel">
        <a href="hotel.html" class="nav-main-btn">НА ГЛАВНУЮ</a>
        <a href="reservations.html" class="nav-reservations-btn">МОИ РЕЗЕРВАЦИИ</a>
    </div>
</div>

<main>
    <h1>КОМНАТЫ</h1>
    <div class="gallery-wrapper">
        <button class="scroll-btn prev-btn" aria-label="Предыдущая комната">&#10094;</button>
        <div class="rooms-gallery"></div>
        <button class="scroll-btn next-btn" aria-label="Следующая комната">&#10095;</button>
    </div>

    <template id="room-template">
        <div class="room-card">
            <img src="" alt="" class="room-img">
            <h3></h3>
            <a href="hotel.html" class="book-btn">ВЫБРАТЬ</a>
        </div>
    </template>
</main>
<script>
    const gallery = document.querySelector('.rooms-gallery');
    const prevBtn = document.querySelector('.prev-btn');
    const nextBtn = document.querySelector('.next-btn');
    const scrollStep = 380;

    function updateScrollButtons() {
        const maxScrollLeft = gallery.scrollWidth - gallery.clientWidth;

        if (maxScrollLeft <= 5) {
            prevBtn.style.visibility = 'hidden';
            nextBtn.style.visibility = 'hidden';
            return;
        }

        prevBtn.style.visibility = 'visible';
        nextBtn.style.visibility = 'visible';
        prevBtn.disabled = gallery.scrollLeft <= 5;
        nextBtn.disabled = gallery.scrollLeft >= maxScrollLeft - 5;
    }

    prevBtn.addEventListener('click', () => {
        gallery.scrollBy({left: -scrollStep, behavior: 'smooth'});
    });

    nextBtn.addEventListener('click', () => {
        gallery.scrollBy({left: scrollStep, behavior: 'smooth'});
    });

    gallery.addEventListener('wheel', (e) => {
        if (e.deltaY !== 0) {
            e.preventDefault();
            gallery.scrollBy({
                left: e.deltaY > 0 ? scrollStep : -scrollStep,
                behavior: 'smooth'
            });
        }
    }, {passive: false});

    gallery.addEventListener('scroll', updateScrollButtons);
    window.addEventListener('resize', updateScrollButtons);

    new MutationObserver(updateScrollButtons).observe(gallery, {childList: true});

    updateScrollButtons();
</script>
<script src="js/rooms.js"></script>
</body>
</html>
